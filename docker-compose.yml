services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: proyecto_cyber
      POSTGRES_USER: cyber
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber -d proyecto_cyber"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cyber:${DB_PASSWORD}@db:5432/proyecto_cyber
      JWT_SECRET: ${JWT_SECRET}
      SCANNER_API_KEY: ${SCANNER_API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-proyecto-cyber@localhost}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
    ports:
      - "8000:8000"
    volumes:
      - reports_data:/app/reports

  scanner:
    build: ./scanner
    restart: unless-stopped
    network_mode: host
    depends_on:
      - api
    environment:
      API_URL: http://localhost:8000
      SCANNER_API_KEY: ${SCANNER_API_KEY}
      SCAN_INTERVAL_SECONDS: 300

  enricher:
    build: ./enricher
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
      SCANNER_API_KEY: ${SCANNER_API_KEY}
      CHECK_INTERVAL_SECONDS: 600
      NVD_API_KEY: ${NVD_API_KEY:-}

  credcheck:
    build: ./credcheck
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
      SCANNER_API_KEY: ${SCANNER_API_KEY}
      CHECK_INTERVAL_SECONDS: 1800

  reporter:
    build: ./reporter
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
      SCANNER_API_KEY: ${SCANNER_API_KEY}
      REPORT_INTERVAL_SECONDS: 604800
    volumes:
      - reports_data:/app/reports

  mcp:
    build: ./mcp
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PROYECTO_CYBER_URL: http://api:8000
      PROYECTO_CYBER_API_KEY: ${MCP_API_KEY:-}
    ports:
      - "8010:8000"

volumes:
  db_data:
  reports_data:
