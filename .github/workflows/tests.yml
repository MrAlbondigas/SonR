name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests
        run: pytest app/tests -v
        env:
          DATABASE_URL: sqlite:///./test_proyecto_cyber.db
          JWT_SECRET: ci-test-secret
          SCANNER_API_KEY: ci-test-scanner-key
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: CiTestPass123!
          ALERT_WEBHOOK_URL: ""
